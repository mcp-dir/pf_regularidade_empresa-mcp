# Smithery configuration for Polícia Federal: Situação e Regularidade de Empresa de Segurança Privada
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pf_regularidade_empresa

name: pf_regularidade_empresa-mcp
displayName: "Polícia Federal: Situação e Regularidade de Empresa de Segurança Privada"
description: >
  Polícia Federal: Situação e Regularidade de Empresa de Segurança Privada, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pf_regularidade_empresa-mcp
repository: https://github.com/mcp-dir/pf_regularidade_empresa-mcp

tags:
  - pf_regularidade_empresa
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pf_regularidade_empresa

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pf_regularidade_empresa/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
